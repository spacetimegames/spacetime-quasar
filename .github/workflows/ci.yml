# CI for Phase 0, as specified by docs/adr/0003-ci-design.adoc.
#
# The `name:` of each job is a required status check on main. Never generate
# names from a matrix expression and never add path filters.
#
# The `determinism` job (ADR 0003, ADR 0008) compares the harness output that
# the four producers (the three test jobs and wasm32) upload as
# `determinism-<platform>`. Add it to branch protection only after it has run
# green on main (ADR 0003).
#
# Not yet implemented (later phases, added together with their harness):
#   - `render (lavapipe)` (Phase 2): renderer golden-image tests via
#     `nix develop -c env -u RUSTC_WRAPPER
#     -u CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS cargo test ...`
#     (timeout 45 minutes).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  test-linux:
    name: test (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test (linux-x86_64)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo bench --workspace --no-run --locked
      # ADR 0008: the harness also runs the leak detector here (exit status 3).
      - name: Determinism harness
        run: cargo run --release --locked -p determinism -- --out determinism-linux-x86_64.txt
      - name: Compare with the reference
        run: diff -u tools/determinism/reference.txt determinism-linux-x86_64.txt
      # Upload even when the diff failed, so the `determinism` job can report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: determinism-linux-x86_64
          path: determinism-linux-x86_64.txt
          retention-days: 7

  test-windows:
    name: test (windows-x86_64)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test (windows-x86_64)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Determinism harness
        run: cargo run --release --locked -p determinism -- --out determinism-windows-x86_64.txt
      - name: Compare with the reference
        shell: bash
        run: diff -u tools/determinism/reference.txt determinism-windows-x86_64.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: determinism-windows-x86_64
          path: determinism-windows-x86_64.txt
          retention-days: 7

  test-macos:
    name: test (macos-aarch64)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test (macos-aarch64)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Determinism harness
        run: cargo run --release --locked -p determinism -- --out determinism-macos-aarch64.txt
      - name: Compare with the reference
        run: diff -u tools/determinism/reference.txt determinism-macos-aarch64.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: determinism-macos-aarch64
          path: determinism-macos-aarch64.txt
          retention-days: 7

  wasm32:
    name: wasm32
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm32
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo build --workspace --target wasm32-unknown-unknown --locked
      # ADR 0003, ADR 0008: the golden tests and the determinism harness run on
      # wasm32-wasip1 under wasmtime (the version nixpkgs pins).
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: wasmtime@49.0.2
      - name: Tests on wasm32-wasip1
        run: cargo test --locked --target wasm32-wasip1 -p st-math -p st-rng -p st-time -p st-sim -p st-data -p determinism
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=.
      - name: Determinism harness on wasm32-wasip1
        run: cargo run --release --locked --target wasm32-wasip1 -p determinism -- --out determinism-wasm32.txt
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=.
      - name: Compare with the reference
        run: diff -u tools/determinism/reference.txt determinism-wasm32.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: determinism-wasm32
          path: determinism-wasm32.txt
          retention-days: 7

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.88.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
      - run: cargo +1.88.0 build --workspace --all-targets --locked

  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check
      # ADR 0002: cargo-deny has no name globs, so engine crates are also
      # rejected by prefix in the lockfile.
      - name: Lockfile engine-prefix check
        run: "! grep -E '^name = \"(bevy|godot|gdnative|fyrox|rg3d|three-d|rend3)([-_][a-z0-9_-]*)?\"$' Cargo.lock"

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install asciidoctor
        run: |
          gem install --user-install asciidoctor -v 2.0.26
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"
      - name: asciidoctor
        run: git ls-files -z '*.adoc' | xargs -0 -n1 asciidoctor --failure-level WARN -o /dev/null
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  nix:
    name: nix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - run: nix flake check -L
      - run: nix flake check --all-systems --no-build

  # ADR 0003, ADR 0008: compares the four harness outputs with each other and
  # with tools/determinism/reference.txt. `!cancelled()` makes it run when a
  # producer failed, and the first step then fails the job, because a job that
  # is skipped because a needed job failed would count as passed for a required
  # check. The steps after it run anyway to show what diverged.
  determinism:
    name: determinism
    needs: [test-linux, test-windows, test-macos, wasm32]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Every producer succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !cancelled() }}
        with:
          pattern: determinism-*
          path: artifacts
      - name: Compare the four outputs and the reference
        if: ${{ !cancelled() }}
        run: bash tools/ci/determinism-compare.sh artifacts tools/determinism/reference.txt
