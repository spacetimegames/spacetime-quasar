[package]
name = "st-game"
description = "Game glue: input mapping, camera rigs, session loop and content wiring."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Off by default: release and Nix builds carry no watcher (ADR 0010, "Hot
# reload"). The app enables it in dev builds only. The module compiles to
# nothing on wasm32.
default = []
hot-reload = ["dep:st-platform", "dep:st-data", "dep:st-time", "st-platform/hot-reload"]

[dependencies]
st-data = { path = "../st-data", optional = true }
st-platform = { path = "../st-platform", optional = true }
st-time = { path = "../st-time", optional = true }

[dev-dependencies]
# Turns the feature on for this crate's own tests, so plain `cargo test
# --workspace` runs them while normal builds stay without the watcher.
st-game = { path = ".", features = ["hot-reload"] }
serde.workspace = true

[lints]
workspace = true
