[workspace]
resolver = "3"
members = [
    "crates/st-audio",
    "crates/st-data",
    "crates/st-game",
    "crates/st-geometry",
    "crates/st-hud",
    "crates/st-materials",
    "crates/st-math",
    "crates/st-platform",
    "crates/st-render",
    "crates/st-rng",
    "crates/st-sim",
    "crates/st-time",
    "tools/determinism",
    "tools/phase1-demo",
    "tools/xtask",
    "apps/spacetime-quasar",
]

[workspace.dependencies]
winit = "0.30"
wgpu = "30.0.1"
# ADR 0010: data schema versioning. Features are the minimum the ADR admits.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
ron = { version = "0.12.2", default-features = false, features = ["std"] }
serde_path_to_error = "0.1.20"
serde_ignored = "0.1.14"
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }

glam = { version = "0.33.12", default-features = false, features = ["f64", "libm", "scalar-math"] }
libm = "0.2.16"

# ADR 0007: the physics stack, in st-sim only. Parry only through rapier3d_f64::parry.
rapier3d-f64 = { version = "0.36.1", default-features = false, features = ["dim3", "f64", "alloc", "enhanced-determinism"] }

[workspace.package]
edition = "2024"
rust-version = "1.89"

[workspace.lints.rust]
missing_docs = "warn"
# Unsafe is denied by default; a crate may allow it narrowly with #[allow(unsafe_code)] on the smallest scope plus a // SAFETY: comment, approved by the Architect.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

# The physics stack is unusably slow unoptimised (ADR 0008's physics-swarm runs 7,200
# ticks of 200 compound bodies in several tests). Optimising it in the dev and test
# profiles changes no floating-point result: rustc never reassociates or fuses.
[profile.dev.package.rapier3d-f64]
opt-level = 3
[profile.dev.package.parry3d-f64]
opt-level = 3
[profile.dev.package.glamx]
opt-level = 3
[profile.dev.package.glam]
opt-level = 3
[profile.dev.package.nalgebra]
opt-level = 3
[profile.dev.package.simba]
opt-level = 3
[profile.dev.package.wide]
opt-level = 3
[profile.dev.package.libm]
opt-level = 3
