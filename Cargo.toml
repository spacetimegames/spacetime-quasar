[workspace]
resolver = "3"
members = [
    "crates/st-audio",
    "crates/st-data",
    "crates/st-game",
    "crates/st-geometry",
    "crates/st-hud",
    "crates/st-materials",
    "crates/st-math",
    "crates/st-platform",
    "crates/st-render",
    "crates/st-rng",
    "crates/st-sim",
    "crates/st-time",
    "tools/xtask",
    "apps/spacetime-quasar",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
