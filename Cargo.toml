[workspace]
resolver = "3"
members = [
    "crates/st-audio",
    "crates/st-data",
    "crates/st-game",
    "crates/st-geometry",
    "crates/st-hud",
    "crates/st-materials",
    "crates/st-math",
    "crates/st-platform",
    "crates/st-render",
    "crates/st-rng",
    "crates/st-sim",
    "crates/st-time",
    "tools/determinism",
    "tools/phase1-demo",
    "tools/xtask",
    "apps/spacetime-quasar",
]

[workspace.dependencies]
winit = "0.30"
wgpu = "30.0.1"
# ADR 0010: data schema versioning. Features are the minimum the ADR admits.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
ron = { version = "0.12.2", default-features = false, features = ["std"] }
serde_path_to_error = "0.1.20"
serde_ignored = "0.1.14"
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }

glam = { version = "0.33.12", default-features = false, features = ["f64", "libm", "scalar-math"] }
libm = "0.2.16"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
missing_docs = "warn"
# Unsafe is denied by default; a crate may allow it narrowly with #[allow(unsafe_code)] on the smallest scope plus a // SAFETY: comment, approved by the Architect.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
