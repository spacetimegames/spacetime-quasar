[workspace]
resolver = "3"
members = [
    "crates/st-audio",
    "crates/st-data",
    "crates/st-game",
    "crates/st-geometry",
    "crates/st-hud",
    "crates/st-materials",
    "crates/st-math",
    "crates/st-platform",
    "crates/st-render",
    "crates/st-rng",
    "crates/st-sim",
    "crates/st-time",
    "tools/xtask",
    "apps/spacetime-quasar",
]

[workspace.dependencies]
winit = "0.30"
wgpu = "30.0.1"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
missing_docs = "warn"
# Unsafe is denied by default; a crate may allow it narrowly with #[allow(unsafe_code)] on the smallest scope plus a // SAFETY: comment, approved by the Architect.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
