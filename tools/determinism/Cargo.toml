[package]
name = "determinism"
description = "Determinism harness: runs the st-sim scenarios and prints their state hashes."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
st-sim = { path = "../../crates/st-sim" }

# The leak detector (ADR 0008) forwards the C math symbols to libm. It is
# compiled on x86_64 Linux only.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libm.workspace = true

[lints]
workspace = true
